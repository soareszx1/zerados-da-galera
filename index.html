<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zerados da Galera</title>
<meta name="description" content="Comunidade da galera para registrar jogos zerados, o que está jogando, dicas, tier list e muito mais.">
<meta name="theme-color" content="#FF3B6B">
<meta property="og:title" content="Zerados da Galera">
<meta property="og:description" content="Jogos zerados, jogando agora, dicas, tier list, chat e ranking da galera.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zeradosdagalera.com.br/">
<meta property="og:image" content="https://zeradosdagalera.com.br/img/banner.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="675">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://zeradosdagalera.com.br/img/banner.jpg">
<link rel="icon" type="image/png" href="img/favicon-64.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zerados">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Creepster&family=Orbitron:wght@600;800&family=Pacifico&family=Permanent+Marker&family=Press+Start+2P&family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css?v=20261104e">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="logo"><a href="#inicio"><img class="logomark" src="img/logo-160.png" alt="" width="80" height="80"><span class="logotext">Zerados<br>da <span>Galera</span></span></a></h1>
    <div class="actions" id="actions"></div>
  </header>
  <div id="banner"></div>
  <nav class="tabs" id="tabs" aria-label="Seções do site"></nav>
  <nav class="subtabs" id="subtabs" aria-label="Nesta seção" hidden></nav>
  <a class="chatfab" id="chatfab" href="#chat" aria-label="Abrir o chat da galera"></a>
  <div class="filters" id="filters">
    <input type="search" id="q" placeholder="Buscar jogo…" aria-label="Buscar jogo">
    <div class="seg" id="scope" role="group" aria-label="Período">
      <button data-scope="all" aria-pressed="true">Todos os tempos</button>
      <button data-scope="year" aria-pressed="false" id="yearBtn">Zerados no ano</button>
    </div>
    <select id="status" aria-label="Status">
      <option value="">Todos os status</option><option value="jogando">Jogando</option><option value="zerado">Zerado</option>
      <option value="platinado">Platinado / 100%</option><option value="pausado">Pausado</option><option value="dropado">Dropado</option><option value="quero">Na fila</option>
    </select>
    <select id="platform" aria-label="Plataforma"><option value="">Todas as plataformas</option></select>
    <span id="pfilter"></span>
    <select id="sort" aria-label="Ordenar"><option value="recent">Mais recentes</option><option value="nota">Maior nota</option><option value="az">A–Z</option></select>
  </div>
  <main id="view"></main>
  <footer class="credits"><span>Criado por <b>Gordões Enterprise</b></span><span><a href="https://discord.gg/62sU9dEnSj" target="_blank" rel="noopener"><b>Discord da galera</b></a> · <button class="linkbtn" data-act="terms">Termos e privacidade</button> · Nomes e capas: <a href="https://www.wikipedia.org" target="_blank" rel="noopener">Wikipédia</a></span></footer>
</div>
<div id="modal"></div>
<div id="toast"></div>
<div id="lightbox"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" integrity="sha384-TnlRYaR4JYz/lpaGuaiU61PjNberSA4vjLjtF+oRC/IkohkJqnWxw5EmDSOt1vA1" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" integrity="sha384-qn4Jh88HhJA8dplNQyGjOh9OGI4izVhrfj/qIFgaKcdgOE06pXqIKGlsCILZcLAC" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="app.js?v=20261104e"></script>
</body>
</html>
