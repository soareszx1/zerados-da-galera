name: Atualizar promoções

on:
  schedule:
    - cron: "47 */2 * * *"   # a cada 2 horas (horário UTC)
  workflow_dispatch: {}       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: promocoes
  cancel-in-progress: false

jobs:
  promos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar promoções
        run: python scripts/promos.py
      - name: Salvar promos.json
        run: |
          git config user.name "zerados-promos[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promos.json || true
          if git diff --cached --quiet; then echo "Sem mudanças."; else git commit -m "Atualiza promoções" && git pull --rebase && git push; fi
