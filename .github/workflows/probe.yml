name: Teste de lojas (temporario)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe.py > probe-out.txt 2>&1 || true
      - run: |
          git config user.name "zerados-teste[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-out.txt && git commit -m "teste de lojas" && git pull --rebase && git push
