name: Ler Steam

on:
  schedule:
    - cron: "11 * * * *"   # de hora em hora
  workflow_dispatch: {}     # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: steam
  cancel-in-progress: false

jobs:
  steam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler bibliotecas da Steam
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python scripts/steam.py
      - name: Salvar no site
        run: |
          git config user.name "zerados-steam[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A steam || true
          if git diff --cached --quiet; then echo "Nada novo."; else git commit -m "Atualiza Steam" && git pull --rebase && git push; fi
