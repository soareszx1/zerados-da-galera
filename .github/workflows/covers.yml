name: Buscar capas

on:
  schedule:
    - cron: "41 * * * *"   # de hora em hora
  workflow_dispatch: {}     # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: capas
  cancel-in-progress: false

jobs:
  capas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Procurar capas na Wikipédia
        run: python scripts/covers.py
      - name: Salvar capas no site
        run: |
          git config user.name "zerados-capas[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers.json covers || true
          if git diff --cached --quiet; then echo "Nada novo."; else git commit -m "Atualiza capas" && git pull --rebase && git push; fi
