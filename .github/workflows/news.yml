name: Atualizar notícias

on:
  schedule:
    - cron: "17 */3 * * *"   # a cada 3 horas (horário UTC)
  workflow_dispatch: {}       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar notícias
        run: python scripts/news.py
      - name: Salvar news.json
        run: |
          git config user.name "zerados-noticias[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json || true
          if git diff --cached --quiet; then echo "Sem novidades."; else git commit -m "Atualiza notícias" && git push; fi
